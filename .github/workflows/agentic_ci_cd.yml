name: SWAYAM-AGI Agentic CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: evolution-mutation-SWAYAM-PRIME-NODE
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compilers & Clang-17 Core
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-17 llvm-17-dev libclang-17-dev g++-14 gcc-14

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_C_COMPILER=gcc-14 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build SWAYAM Core
      run: |
        cmake --build build --parallel $(nproc)

    - name: Stage Mutation Output Mock (Secure Sandbox)
      run: |
        mkdir -p mutation-output/src/generated
        echo "// Autogenerated Secure Neural Node" > mutation-output/src/generated/QuantumNode_Alpha.h
        echo "# Autonomous Mutation Rationale" > mutation-output/rationale.md

    - name: Upload Mutation Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mutation-output
        path: mutation-output/

  publish-mutation:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Mutation Artifact
        uses: actions/download-artifact@v4
        with:
          name: mutation-output
          path: mutation-output

      - name: Validate Path Allowlist
        run: |
          for f in $(find mutation-output -type f); do
            case "$f" in
              mutation-output/src/generated/* | mutation-output/rationale.md);;
              *) echo "REJECTED: $f outside allowlist"; exit 1;;
            esac
          done

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_KEY }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "Swayam-Publisher-Bot"
          git config --global user.email "publisher@swayam.agi"

      - name: Stage to Staging Branch and Open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NODE_ID="SWAYAM-PRIME-NODE"
          git checkout -B "evolution/staging/${NODE_ID}"
          cp -r mutation-output/src/generated/* src/generated/ 2>/dev/null || true
          git add src/generated/
          git commit -m "mutation: automated staging sync for ${NODE_ID}" || echo "No changes to commit"
          git push origin "evolution/staging/${NODE_ID}" --force-with-lease || true
