name: SWAYAM-AGI Agentic CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-execute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify No Shell Injection Vectors
        run: |
          echo "[SECURITY] Scanning active core source files..."
          if grep -rnE "std::system|popen\(" include/ src/Moltbook.h 2>/dev/null; then
            echo "[FATAL] system call detected in active core!"
            exit 1
          fi
          echo "[SECURITY] Clear. Active code is secure."

      - name: Set up GCC-14 and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake jq curl
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_CXX_STANDARD=23

      - name: Build Titan Core & Supervisor
        run: cmake --build build --config Release

      - name: Execute SWAYAM Titan Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWAYAM_QUARANTINE_LOG: /tmp/quarantine.log
        run: |
          ./build/swayam_core
