name: SWAYAM-AGI Agentic CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-execute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # [VENOMICA SHIELD] The Ultimate Shell-Injection Trap
      - name: Verify No Shell Injection Vectors
        run: |
          echo "[SECURITY] Scanning include/, src/, and scripts/ for shell-spawning calls..."
          if grep -rnE "std::system|popen\(" include/ src/ scripts/ 2>/dev/null; then
            echo "[FATAL] std::system() / popen() detected in the codebase!"
            echo "[FATAL] Blocking execution to prevent command injection."
            exit 1
          fi
          echo "[SECURITY] Clear. No shell spawning calls found anywhere under include/, src/, scripts/"

      # [TOOLCHAIN PARITY] Aligning strictly with Docker Sandbox (GCC-14)
      - name: Set up GCC-14 and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake jq curl
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      # [COMPILATION] C++23 Build Execution
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_CXX_STANDARD=23

      - name: Build Titan Core & Supervisor
        run: cmake --build build --config Release

      # [EXECUTION] Fire the Autonomous Engine
      - name: Execute SWAYAM Titan Core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWAYAM_QUARANTINE_LOG: /tmp/quarantine.log
        run: |
          ./build/swayam_core
