name: SWAYAM-AGI Agentic CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  agentic_core_sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize Sovereign Environment & GCC 14 C++23 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_CXX_STANDARD=23
        
      - name: Build Titan Core
        run: cmake --build build --config Release
        
      - name: Execute Agentic Cognitive Engine
        run: ./build/swayam_core
