name: Sandboxed Mutation Validation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sandbox_execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Sandbox Image
        run: docker build -t swayam-sandbox .
        
      - name: Run Zero-Trust Mutation Execution
        run: |
          # The Ultimate Perimeter: No internet, read-only root, explicit write access only to generated dir
          docker run --rm --network none \
            --read-only --tmpfs /tmp \
            -v ${{ github.workspace }}/src/generated:/home/swayam_agent/workspace/src/generated \
            swayam-sandbox
