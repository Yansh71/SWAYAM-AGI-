name: Sandboxed Mutation Validation

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: evolution-mutation-SWAYAM-PRIME-01
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Master Deployment Matrix (Pre-flight)
        run: python3 scripts/master_deployment_matrix.py

  mutate:
    needs: smoke-test
    if: ${{ vars.KILL_SWITCH != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ID: SWAYAM-PRIME-01
    steps:
      - uses: actions/checkout@v4

      - name: Run Sandbox
        run: |
          mkdir -p mutation-output
          docker run --rm --network none --cpus="1.0" --memory="512m" \
            -v "${PWD}/mutation-output:/out" swayam-agi/moltbook-sandbox:latest

      - uses: actions/upload-artifact@v4
        with:
          name: mutation-output
          path: mutation-output/

