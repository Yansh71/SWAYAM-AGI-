name: Sandboxed Mutation Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  sandbox_execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Immutable Sandbox Vault
        run: docker build -t swayam-sandbox .
        
      - name: Run Zero-Trust Mutation Execution
        run: |
          set -euo pipefail
          
          echo "[VENOMICA] Provisioning host boundary directories..."
          mkdir -p mutation-output/src/generated
          mkdir -p mutation-output/meta
          
          # Eliminate Cross-Boundary Permission Denial
          chmod -R 777 mutation-output/
          
          echo "[VENOMICA] Initiating Sandboxed Cognitive Engine..."
          
          # THE SNIPER SHOT: 
          # No bash, no 'find', no script indirection. We just run the Vault.
          # The Dockerfile's hardcoded ENTRYPOINT guarantees swayam_supervisor executes.
          docker run --rm --network none \
            --read-only --tmpfs /tmp \
            --memory=512m --cpus=1.0 --pids-limit=64 \
            -v ${{ github.workspace }}/mutation-output/src/generated:/home/swayam_agent/workspace/src/generated:rw \
            -v ${{ github.workspace }}/mutation-output/meta:/home/swayam_agent/workspace/meta:rw \
            swayam-sandbox

          echo "[VENOMICA] Execution terminated. Analyzing output state..."

          if [ ! -f mutation-output/meta/status.json ]; then
            echo "[FATAL] Engine produced no status signal — cannot distinguish crash from quarantine."
            exit 1
          fi

          # Explicit Signal Router via jq
          OUTCOME=$(jq -r .outcome mutation-output/meta/status.json)
          
          case "$OUTCOME" in
            published)
              if [ ! -f mutation-output/meta/rationale.md ]; then
                echo "[FATAL] Published outcome missing rationale. Refusing to stage PR."
                exit 1
              fi
              mv mutation-output/meta/rationale.md mutation-output/rationale.md
              echo "[VENOMICA] Mutation verified and rationale staged for PR."
              ;;
            quarantined)
              REASON=$(jq -r .reason mutation-output/meta/status.json || echo "Unknown threat")
              echo "[VENOMICA] Mutation safely quarantined at edge. Reason: $REASON"
              echo "Nothing to publish this cycle."
              exit 0
              ;;
            *)
              echo "[FATAL] Unrecognized cognitive outcome: $OUTCOME"
              exit 1
              ;;
          esac
          
      - name: Upload Mutation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-output
          path: |
            mutation-output/src/
            mutation-output/rationale.md
          if-no-files-found: ignore
