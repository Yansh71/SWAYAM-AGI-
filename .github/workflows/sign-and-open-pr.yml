name: Sign and Publish Mutation

on:
  workflow_run:
    workflows: ["Sandboxed Mutation Validation"]
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Grant execution rights to all shell scripts
        run: |
          chmod +x scripts/*.sh scripts/**/*.sh scripts/testing/*.sh scripts/transforms/*.sh 2>/dev/null || true

      - name: Fetch raw artifact (no auto-extraction)
        env:
          GITHUB_TOKEN: ${{ secrets.WATCHER_READONLY_TOKEN }}
        run: |
          mkdir -p mutation-output
          gh api "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "mutation-output") | .archive_download_url' \
            | xargs -I {} gh api {} > mutation-output.zip

      - name: Securely extract artifact against poisoning
        run: |
          python3 scripts/safe_extract.py mutation-output.zip mutation-output/ --allow "src/generated/*.h" "rationale.md"

      - name: Generate App Installation token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_KEY }}

      - name: Check rate limit (CAS-protected)
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          bash scripts/cas_increment.sh

      - name: AST structural duplicate check
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          python3 scripts/structural_hash.py mutation-output/src/generated/test_mutation.h

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git config --global user.name "swayam-publisher-bot-yansh[bot]"
          git config --global user.email "swayam-publisher-bot-yansh[bot]@users.noreply.github.com"
          
          BRANCH_NAME="mutation-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          
          mkdir -p src/generated
          cp -r mutation-output/src/generated/* src/generated/ 2>/dev/null || true
          cp mutation-output/rationale.md ./rationale.md 2>/dev/null || true
          
          git add src/generated/ rationale.md
          git commit -m "Autonomous Mutation: Agentic Spawning Sequence"
          git push origin "$BRANCH_NAME"
          
          gh pr create --title "Autonomous Mutation: Agentic Spawning Sequence" \
                       --body-file rationale.md \
                       --base main \
                       --head "$BRANCH_NAME"
