name: Sign and Publish Mutation

on:
  workflow_run:
    workflows: ["Sandboxed Mutation Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: evolution-mutation-SWAYAM-PRIME-01
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      REPO: Yansh71/SWAYAM-AGI-
      NODE_ID: SWAYAM-PRIME-01
      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch raw artifact (no auto-extraction)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mutation-output
          artifact_id=$(gh api "repos/${REPO}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '.artifacts[] | select(.name=="mutation-output") | .id')
          gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > mutation-output.zip

      - name: Securely extract artifact against poisoning
        run: |
          python3 scripts/safe_extract.py mutation-output.zip mutation-output/ --allow "src/generated/*.h" "rationale.md"

      - name: Generate App installation token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: Yansh71
          repositories: "SWAYAM-AGI-"

      - name: Check rate limit (CAS-protected)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MAX_MUTATIONS_PER_HOUR: "5"
        run: ./scripts/cas_increment.sh

      - name: AST structural duplicate check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 scripts/structural_hash.py mutation-output/src/generated/*.h

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "SWAYAM-AGI-BOT"
          git config user.email "bot@swayam-agi.local"
          git checkout -b evolution/staging/${NODE_ID}-${{ github.run_id }}
          cp -r mutation-output/src/generated/. src/generated/ || true
          git add src/generated/
          git commit -m "mutation: ${NODE_ID}" || echo "No changes to commit"
          git push -u origin evolution/staging/${NODE_ID}-${{ github.run_id }}
