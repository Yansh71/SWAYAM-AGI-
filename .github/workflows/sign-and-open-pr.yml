name: Sign and Publish Mutation

on:
  workflow_run:
    workflows: ["Sandboxed Mutation Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Grant execution rights to all shell scripts
        run: chmod +x scripts/*.sh scripts/**/*.sh 2>/dev/null || true

      - name: Fetch raw artifact (no auto-extraction)
        id: fetch-artifact
        env:
          # Using the built-in standard GITHUB_TOKEN to avoid missing custom secret errors
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mutation-output
          echo "[VENOMICA] Querying artifact URL for run ID: ${{ github.event.workflow_run.id }}"
          
          ARTIFACT_URL=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" --jq '.artifacts[] | select(.name == "mutation-output") | .archive_download_url' || true)
          
          if [ -z "$ARTIFACT_URL" ]; then
            echo "[VENOMICA] No 'mutation-output' artifact found for this run. Upstream likely had no mutations to publish."
            echo "has_artifact=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "[VENOMICA] Artifact found. Downloading from GitHub API..."
          gh api "$ARTIFACT_URL" > mutation-output.zip
          echo "has_artifact=true" >> $GITHUB_OUTPUT
          
          # Forensic Security Check: Is it actually a zip archive?
          MIME_TYPE=$(file -b --mime-type mutation-output.zip)
          if [[ "$MIME_TYPE" != "application/zip" ]]; then
            echo "[VENOMICA FATAL] API returned non-zip content. Possible auth error or corrupted artifact."
            cat mutation-output.zip
            exit 1
          fi

      - name: Securely extract artifact against poisoning
        if: steps.fetch-artifact.outputs.has_artifact == 'true'
        run: |
          python3 scripts/safe_extract.py mutation-output.zip mutation-output/ --allow "src/generated/*.h" "rationale.md"

      - name: Generate App Installation token
        if: steps.fetch-artifact.outputs.has_artifact == 'true'
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_KEY }}

      - name: Check rate limit (CAS-protected)
        if: steps.fetch-artifact.outputs.has_artifact == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: bash scripts/cas_increment.sh

      - name: AST structural duplicate check
        if: steps.fetch-artifact.outputs.has_artifact == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: python3 scripts/structural_hash.py mutation-output/src/generated/test_mutation.h || true

      - name: Commit and open PR
        if: steps.fetch-artifact.outputs.has_artifact == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git config --global user.name "swayam-publisher-bot-yansh[bot]"
          git config --global user.email "swayam-publisher-bot-yansh[bot]@users.noreply.github.com"
          BRANCH_NAME="mutation-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          
          mkdir -p src/generated
          cp -r mutation-output/src/generated/* src/generated/ 2>/dev/null || true
          cp mutation-output/rationale.md rationale.md 2>/dev/null || true
          
          git add src/generated/ rationale.md
          git commit -m "Autonomous Mutation: Agentic Spawning Sequence"
          git push "https://x-access-token:$GH_TOKEN@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH_NAME"
          
          gh pr create --title "Autonomous Mutation: Agentic Spawning Sequence" --body-file rationale.md --base main --head "$BRANCH_NAME"
